<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="college-header">

        <div class="logo-container">
            <img src="college.jpg" alt="GCET Jammu Logo" class="logo">
        </div>

        <div class="title-container">
            <h1>Govt. College of Engineering and Technology, Jammu</h1>
            <p>(Autonomous College)</p>
        </div>

    </header>


    <nav class="navbar">

        
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="faculty.html">Faculty</a>
            <a href="gallery.html">Gallery</a>
            <a href="admission.html">Admission</a>
            <a href="contact.html">Contact</a>
             <a href="login.html">Student Login</a>
        

    </nav>


    <main class="main-content">

        <h2 class="page-title">Student Admission Form</h2>

        <div class="form-container">

           <form id="admissionForm">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname"
                    placeholder="Enter your name" required>
                </div>


                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>


                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                    placeholder="Enter your email" required>
                </div>


                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile"
                    placeholder="Enter mobile number" required>
                </div>


                <div class="form-group">
                    <label for="course">Course Applied For</label>

                    <select id="course" name="course" required>
                        <option value="">Select Course</option>
                        <option value="cse">Computer Science Engineering</option>
                        <option value="ece">Electronics & Communication Engineering</option>
                        <option value="me">Mechanical Engineering</option>
                        <option value="civil">Civil Engineering</option>
                        <option value="ee">Electrical Engineering</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="address">Address</label>

                    <textarea id="address" name="address"
                    rows="4" placeholder="Enter your address"
                    required></textarea>
                </div>


              <div class="form-group">

    <label>Gender</label>

    <input type="radio" name="gender" value="male" required> Male

    <input type="radio" name="gender" value="female"> Female

    <input type="radio" name="gender" value="other"> Other

</div>

                <div class="form-actions">

                    <button type="submit" class="submit-btn">
                        Submit
                    </button>

                    <button type="reset" class="reset-btn">
                        Reset
                    </button>
                    <p id="admissionMessage"></p>

                </div>

            </form>

        </div>

    </main>


   
<script src="validation.js"></script>
</body>

</html>
